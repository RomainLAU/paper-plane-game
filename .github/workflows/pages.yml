name: Déploiement GitHub Pages

# Publie le jeu à chaque push sur la branche par défaut (ou sur main si elle est créée plus tard)
on:
  push:
    branches: [main, claude/gallant-hawking-e1xbx5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Prépare les fichiers du site
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Copie des fichiers du jeu
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # 2) Publie (job séparé : l'archive a le temps d'être enregistrée par GitHub)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
